rewards:
  # Bosses take precedence over the other mob lists.
  boss: 300
  hostile: 10
  passive: 5
  boss-mobs:
    - ENDER_DRAGON
    - WITHER
    - WARDEN
    - ELDER_GUARDIAN
    - PIGLIN_BRUTE
  # Hostile mobs pay less to make common farms less profitable.
