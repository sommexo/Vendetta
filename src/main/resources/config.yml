pvp:
  base-reward: 500
  bounty-percent: 0.25
  death-penalty: 2500
  timeout-seconds: 15
  # A killer cannot earn Marks or inflict the Marks penalty by repeatedly killing the same victim.
  repeat-kill-cooldown-seconds: 600
vanguard:
  berserker:
    dormant-multiplier: 1.10
    imperfect-multiplier: 1.25
    perfect-multiplier: 1.50
    perfect-critical-multiplier: 1.75
  bloodthirst:
    dormant-window-ms: 750
    imperfect-window-ms: 1000
    cooldown-seconds: 30
  ultimate:
    dormant-cooldown-seconds: 240
    awakened-cooldown-seconds: 480
    ascendant-cooldown-seconds: 2400
    dormant-strength-level: 1
    dormant-speed-level: 1
    awakened-strength-level: 2
    awakened-speed-level: 2
    awakened-fire-resistance: true
    ally-duration-seconds: 6
    ally-range-blocks: 16
    ally-strength-level: 2
    ally-speed-level: 1
    ascendant-starting-strength: 2
    ascendant-strength-cap: 4
    ascendant-strength-refresh-seconds: 60
settings:
  opCooldownBypass: false
relics:
  exploration-drop-chance: 0.002
  exploration-perfect-chance: 0.05
  prices:
    level-1: 1000
    level-2: 2000
    level-3: 2000
bounties:
  max-items-per-type-per-target: 4096
  # Used only to compare unlike bounty items when choosing the Prime Target.
  value:
    diamond: 1
    nether-star: 9
